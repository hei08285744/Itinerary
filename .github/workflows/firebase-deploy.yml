name: Deploy to Firebase

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/99018691027/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions@itinerary-hei08285744.iam.gserviceaccount.com

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.28.1

      - name: Deploy to Firebase
        run: firebase deploy --project itinerary-hei08285744 --non-interactive